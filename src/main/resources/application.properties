spring.application.name=defusion-bcp

server.port=${SERVER_PORT:8080}

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/defusion_bcp?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=America/La_Paz}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=America/La_Paz

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

server.servlet.session.timeout=30m
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.secure=${SESSION_COOKIE_SECURE:false}
server.forward-headers-strategy=framework
server.error.include-message=never

management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=when-authorized

app.security.allowed-origin=${FRONTEND_ORIGIN:http://localhost:5173}

app.sap.base-url=${SAP_BASE_URL}
app.sap.company-db=${SAP_COMPANY_DB}
app.sap.tls-reject-unauthorized=${SAP_TLS_REJECT_UNAUTHORIZED:true}
app.sap.connect-timeout=${SAP_CONNECT_TIMEOUT:10s}
app.sap.read-timeout=${SAP_READ_TIMEOUT:30s}

app.bcp.crypto.company-id=${BCP_COMPANY_ID:2295}
app.bcp.crypto.business-certificate-path=${BCP_BUSINESS_CERTIFICATE_PATH:}
app.bcp.crypto.signing-certificate-path=${BCP_SIGNING_CERTIFICATE_PATH:}
app.bcp.crypto.signing-certificate-password=${BCP_SIGNING_CERTIFICATE_PASSWORD:}

logging.level.root=INFO
logging.level.com.example.defusion_bcp=INFO
logging.pattern.level=%5p [bcpRequestId=%X{bcpRequestId:-none}]
logging.file.name=${LOG_FILE:logs/defusion-bcp.log}
logging.logback.rollingpolicy.max-file-size=10MB
logging.logback.rollingpolicy.max-history=30
