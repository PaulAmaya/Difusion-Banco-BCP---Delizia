name: defusion-bcp-production

services:
  mysql:
    image: mysql:8.4.11
    restart: unless-stopped
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_unicode_ci"]
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-defusion_bcp}
      MYSQL_USER: ${MYSQL_USER:?Complete MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Complete MYSQL_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Complete MYSQL_ROOT_PASSWORD}
      TZ: America/La_Paz
    volumes:
      - mysql-data:/var/lib/mysql
    networks: [database]
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u$${MYSQL_USER} -p$${MYSQL_PASSWORD} --silent"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s

  backend:
    build: .
    restart: unless-stopped
    environment:
      DB_URL: jdbc:mysql://mysql:3306/${MYSQL_DATABASE:-defusion_bcp}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=America/La_Paz
      DB_USERNAME: ${MYSQL_USER:?Complete MYSQL_USER}
      DB_PASSWORD: ${MYSQL_PASSWORD:?Complete MYSQL_PASSWORD}
      SAP_BASE_URL: ${SAP_BASE_URL:?Complete SAP_BASE_URL}
      SAP_COMPANY_DB: ${SAP_COMPANY_DB:?Complete SAP_COMPANY_DB}
      SAP_TLS_REJECT_UNAUTHORIZED: "true"
      BCP_ENVIRONMENT: "PRODUCTION"
      BCP_PAYMENTS_ENABLED: ${BCP_PAYMENTS_ENABLED:-false}
      BCP_ALLOW_DOCUMENT_REVERSAL: "false"
      BCP_SANDBOX_LEGACY_RSA_ENABLED: "false"
      BCP_MULTIPLE_URL: https://credinetweb.bcp.com.bo/ApiCwV2/api/APIAuth/ProcessMultiple
      BCP_EXTRACTS_URL: https://credinetweb.bcp.com.bo/ApiCwV2/api/APIAuth/GetExtracts
      BCP_COMPANY_ID: ${BCP_COMPANY_ID:?Complete BCP_COMPANY_ID}
      BCP_BASIC_USERNAME: ${BCP_BASIC_USERNAME:-}
      BCP_BASIC_PASSWORD: ${BCP_BASIC_PASSWORD:-}
      BANK_DIFFUSION_PASSWORD: ${BANK_DIFFUSION_PASSWORD:-}
      BANK_DIFFUSION_DOCUMENT_NUMBER: ${BANK_DIFFUSION_DOCUMENT_NUMBER:-}
      BANK_STATEMENT_DOCUMENT_NUMBER: ${BANK_DIFFUSION_DOCUMENT_NUMBER:-}
      BANK_DIFFUSION_DOCUMENT_TYPE: ${BANK_DIFFUSION_DOCUMENT_TYPE:-}
      BANK_DIFFUSION_DOCUMENT_EXTENSION: ${BANK_DIFFUSION_DOCUMENT_EXTENSION:-}
      BANK_DIFFUSION_FUND_SOURCE: ${BANK_DIFFUSION_FUND_SOURCE:-}
      BANK_DIFFUSION_FUND_DESTINATION: ${BANK_DIFFUSION_FUND_DESTINATION:-}
      BANK_DIFFUSION_DESCRIPTION: ${BANK_DIFFUSION_DESCRIPTION:-}
      BANK_DIFFUSION_SEND_VOUCHERS: ${BANK_DIFFUSION_SEND_VOUCHERS:-}
      BANK_DIFFUSION_APPROVERS_JSON: ${BANK_DIFFUSION_APPROVERS_JSON:-[]}
      BCP_TLS_PROTOCOLS: ${BCP_TLS_PROTOCOLS:-TLSv1.3}
      BCP_CONNECT_TIMEOUT: ${BCP_CONNECT_TIMEOUT:-10s}
      BCP_READ_TIMEOUT: ${BCP_READ_TIMEOUT:-60s}
      BCP_AUTH_CERTIFICATE_PATH: ${BCP_AUTH_CERTIFICATE_PATH:?Complete BCP_AUTH_CERTIFICATE_PATH}
      BCP_AUTH_CERTIFICATE_PASSWORD: ${BCP_AUTH_CERTIFICATE_PASSWORD:-}
      BCP_BUSINESS_CERTIFICATE_PATH: ${BCP_BUSINESS_CERTIFICATE_PATH:?Complete BCP_BUSINESS_CERTIFICATE_PATH}
      BCP_SIGNING_CERTIFICATE_PATH: ${BCP_SIGNING_CERTIFICATE_PATH:?Complete BCP_SIGNING_CERTIFICATE_PATH}
      BCP_SIGNING_CERTIFICATE_PASSWORD: ${BCP_SIGNING_CERTIFICATE_PASSWORD:-}
      FRONTEND_ORIGIN: ${FRONTEND_ORIGIN:?Complete FRONTEND_ORIGIN}
      SESSION_COOKIE_SECURE: "false"
      LOG_FILE: /app/logs/defusion-bcp.log
      TZ: America/La_Paz
    volumes:
      - backend-logs:/app/logs
      - type: bind
        source: ${BCP_CERT_HOST_DIRECTORY:?Complete BCP_CERT_HOST_DIRECTORY}
        target: /run/bcp-certs
        read_only: true
        bind:
          create_host_path: false
    networks: [database, portal]
    depends_on:
      mysql:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:8080/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s

  frontend:
    build: ./frontend
    restart: unless-stopped
    ports:
      - "${PORTAL_BIND_IP:?Complete PORTAL_BIND_IP}:${PORTAL_PORT:-8081}:80"
    volumes:
      - ./frontend/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    networks: [portal]
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1/healthz || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 5

volumes:
  mysql-data:
  backend-logs:

networks:
  database:
    internal: true
  portal:
