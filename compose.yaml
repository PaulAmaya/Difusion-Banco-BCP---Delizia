name: defusion-bcp

services:
  mysql:
    image: mysql:8.4.11
    restart: unless-stopped
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-defusion_bcp}
      MYSQL_USER: ${MYSQL_USER:?Defina MYSQL_USER en el archivo .env}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Defina MYSQL_PASSWORD en el archivo .env}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Defina MYSQL_ROOT_PASSWORD en el archivo .env}
      TZ: America/La_Paz
    ports:
      - "127.0.0.1:${MYSQL_PORT:-3307}:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u$${MYSQL_USER} -p$${MYSQL_PASSWORD} --silent"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      DB_URL: jdbc:mysql://mysql:3306/${MYSQL_DATABASE:-defusion_bcp}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=America/La_Paz
      DB_USERNAME: ${MYSQL_USER:?Defina MYSQL_USER en el archivo .env}
      DB_PASSWORD: ${MYSQL_PASSWORD:?Defina MYSQL_PASSWORD en el archivo .env}
      SAP_BASE_URL: ${SAP_BASE_URL:?Defina SAP_BASE_URL en el archivo .env}
      SAP_COMPANY_DB: ${SAP_COMPANY_DB:?Defina SAP_COMPANY_DB en el archivo .env}
      SAP_TLS_REJECT_UNAUTHORIZED: ${SAP_TLS_REJECT_UNAUTHORIZED:-true}
      SAP_CONNECT_TIMEOUT: ${SAP_CONNECT_TIMEOUT:-10s}
      SAP_READ_TIMEOUT: ${SAP_READ_TIMEOUT:-30s}
      BCP_COMPANY_ID: ${BCP_COMPANY_ID:-2295}
      BCP_ENVIRONMENT: ${BCP_ENVIRONMENT:-SANDBOX}
      BCP_EXTRACTS_URL: ${BCP_EXTRACTS_URL:-}
      BCP_PAYMENTS_ENABLED: ${BCP_PAYMENTS_ENABLED:-false}
      BCP_ALLOW_DOCUMENT_REVERSAL: ${BCP_ALLOW_DOCUMENT_REVERSAL:-false}
      BCP_MULTIPLE_URL: ${BCP_MULTIPLE_URL:-https://www99.bancred.com.bo/ApiCwV2/api/APIAuth/ProcessMultiple}
      BCP_BASIC_USERNAME: ${BCP_BASIC_USERNAME:-}
      BCP_BASIC_PASSWORD: ${BCP_BASIC_PASSWORD:-}
      BCP_TLS_PROTOCOLS: ${BCP_TLS_PROTOCOLS:-TLSv1.3}
      BCP_SANDBOX_LEGACY_RSA_ENABLED: ${BCP_SANDBOX_LEGACY_RSA_ENABLED:-false}
      BCP_CONNECT_TIMEOUT: ${BCP_CONNECT_TIMEOUT:-10s}
      BCP_READ_TIMEOUT: ${BCP_READ_TIMEOUT:-60s}
      BCP_AUTH_CERTIFICATE_PATH: ${BCP_AUTH_CERTIFICATE_PATH:-}
      BCP_AUTH_CERTIFICATE_PASSWORD: ${BCP_AUTH_CERTIFICATE_PASSWORD:-}
      BANK_DIFFUSION_PASSWORD: ${BANK_DIFFUSION_PASSWORD:-}
      BANK_STATEMENT_PASSWORD: ${BANK_STATEMENT_PASSWORD:-${BANK_DIFFUSION_PASSWORD:-}}
      BANK_STATEMENT_DOCUMENT_NUMBER: ${BANK_STATEMENT_DOCUMENT_NUMBER:-}
      BANK_DIFFUSION_DOCUMENT_NUMBER: ${BANK_DIFFUSION_DOCUMENT_NUMBER:-}
      BANK_DIFFUSION_DOCUMENT_TYPE: ${BANK_DIFFUSION_DOCUMENT_TYPE:-Q}
      BANK_DIFFUSION_DOCUMENT_EXTENSION: ${BANK_DIFFUSION_DOCUMENT_EXTENSION:-LP}
      BANK_DIFFUSION_FUND_SOURCE: ${BANK_DIFFUSION_FUND_SOURCE:-Ambiente sandbox}
      BANK_DIFFUSION_FUND_DESTINATION: ${BANK_DIFFUSION_FUND_DESTINATION:-Ambiente de pruebas}
      BANK_DIFFUSION_DESCRIPTION: ${BANK_DIFFUSION_DESCRIPTION:-Descripcion prueba}
      BANK_DIFFUSION_SEND_VOUCHERS: ${BANK_DIFFUSION_SEND_VOUCHERS:-}
      BANK_DIFFUSION_APPROVERS_JSON: ${BANK_DIFFUSION_APPROVERS_JSON:-}
      BANK_DIFFUSION_SOURCE_ACCOUNT: ${BANK_DIFFUSION_SOURCE_ACCOUNT:-}
      BCP_BUSINESS_CERTIFICATE_PATH: /run/bcp-certs/BUSINESS.cer
      BCP_SIGNING_CERTIFICATE_PATH: /run/bcp-certs/ENC_DESA.pfx
      BCP_SIGNING_CERTIFICATE_PASSWORD: ${BCP_SIGNING_CERTIFICATE_PASSWORD:?Defina BCP_SIGNING_CERTIFICATE_PASSWORD en el archivo .env}
      FRONTEND_ORIGIN: http://localhost:${FRONTEND_PORT:-5174}
      LOG_FILE: /app/logs/defusion-bcp.log
      TZ: America/La_Paz
    ports:
      - "127.0.0.1:${BACKEND_PORT:-8081}:8080"
    volumes:
      - backend-logs:/app/logs
      - type: bind
        source: ${BCP_AUTH_CERT_HOST_DIRECTORY:-./bank-auth-certs}
        target: /run/bcp-auth
        read_only: true
      - type: bind
        source: ${BCP_BUSINESS_CERT_HOST_PATH:?Defina BCP_BUSINESS_CERT_HOST_PATH en el archivo .env}
        target: /run/bcp-certs/BUSINESS.cer
        read_only: true
      - type: bind
        source: ${BCP_SIGNING_CERT_HOST_PATH:?Defina BCP_SIGNING_CERT_HOST_PATH en el archivo .env}
        target: /run/bcp-certs/ENC_DESA.pfx
        read_only: true
    depends_on:
      mysql:
        condition: service_healthy
        restart: true
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:8080/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-5174}:80"
    depends_on:
      backend:
        condition: service_healthy
        restart: true
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1/healthz || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s

volumes:
  mysql-data:
  backend-logs:
